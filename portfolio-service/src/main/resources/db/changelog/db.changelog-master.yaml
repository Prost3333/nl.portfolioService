databaseChangeLog:
  - include:
      file: db/changelog/changes/001-create-positions-table.yaml
  - include:
      file: db/changelog/changes/002-create-snapshots-table.yaml
  - include:
      file: db/changelog/changes/003-add-average-price-to-positions.yaml
  - include:
      file: db/changelog/changes/004-create-trades-table.yaml
  - include:
      file: db/changelog/changes/005-add-journal-fields-to-trades.yaml
  # Личные данные: файлы лежат в db/changelog/local/, который не коммитится.
  # errorIfMissingOrEmpty: false — на чистом клоне папки нет, и это не ошибка.
  - includeAll:
      path: db/changelog/local/
      errorIfMissingOrEmpty: false
  # Строго после includeAll: локальный импорт добавляет настоящие сделки, и позиции,
  # которые он покрывает, сиротами быть перестают. Поставить 007 выше — значит завести
  # им ещё и синтетическую покупку сверху, то есть удвоить количество.
  - include:
      file: db/changelog/changes/007-backfill-trades-for-legacy-positions.yaml
