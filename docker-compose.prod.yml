# Production stack for running on a server (e.g. Oracle Cloud Always Free VM).
# Standalone file (NOT an overlay):
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differences vs docker-compose.yml:
#   - restart: unless-stopped everywhere -> the stack survives crashes and VM reboots
#   - databases, Kafka and Zookeeper are NOT published on the host at all
#     (services reach them over the internal Docker network)
#   - JVM heap caps so three Spring services + Kafka fit comfortably in RAM
#   - TZ for portfolio-service so the 18:00 snapshot cron fires in your timezone,
#     not in UTC (override with TZ=... in .env if needed)

services:
  postgres-auth:
    image: postgres:15
    container_name: postgres-auth
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
      POSTGRES_USER: ${AUTH_DB_USER:-auth}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    volumes:
      - auth_data:/var/lib/postgresql/data

  postgres-report:
    image: postgres:15
    container_name: postgres-report
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${REPORT_DB_NAME:-report_db}
      POSTGRES_USER: ${REPORT_DB_USER:-report}
      POSTGRES_PASSWORD: ${REPORT_DB_PASSWORD}
    volumes:
      - report_data:/var/lib/postgresql/data

  postgres-portfolio:
    image: postgres:15
    container_name: postgres-portfolio
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PORTFOLIO_DB_NAME:-portfolio_db}
      POSTGRES_USER: ${PORTFOLIO_DB_USER:-portfolio}
      POSTGRES_PASSWORD: ${PORTFOLIO_DB_PASSWORD}
    volumes:
      - portfolio_data:/var/lib/postgresql/data

  postgres-ai:
    image: postgres:15
    container_name: postgres-ai
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AI_DB_NAME:-ai_db}
      POSTGRES_USER: ${AI_DB_USER:-ai}
      POSTGRES_PASSWORD: ${AI_DB_PASSWORD}
    volumes:
      - ai_data:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"

  portfolio-service:
    build: ./portfolio-service
    restart: unless-stopped
    depends_on:
      - postgres-portfolio
      - kafka
    ports:
      - "8084:8084"
    environment:
      DB_URL: jdbc:postgresql://postgres-portfolio:5432/${PORTFOLIO_DB_NAME:-portfolio_db}
      DB_USERNAME: ${PORTFOLIO_DB_USER:-portfolio}
      DB_PASSWORD: ${PORTFOLIO_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: "-Xmx512m"
      TZ: ${TZ:-Europe/Amsterdam}

  auth-service:
    build: ./auth-service
    restart: unless-stopped
    depends_on:
      - postgres-auth
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres-auth:5432/${AUTH_DB_NAME:-auth_db}
      DB_USERNAME: ${AUTH_DB_USER:-auth}
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JAVA_TOOL_OPTIONS: "-Xmx384m"

  report-service:
    build: ./report-service
    restart: unless-stopped
    depends_on:
      - postgres-report
      - kafka
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:postgresql://postgres-report:5432/${REPORT_DB_NAME:-report_db}
      DB_USERNAME: ${REPORT_DB_USER:-report}
      DB_PASSWORD: ${REPORT_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: "-Xmx384m"

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    depends_on:
      - postgres-ai
      - kafka
    ports:
      - "8085:8085"
    environment:
      DB_URL: jdbc:postgresql://postgres-ai:5432/${AI_DB_NAME:-ai_db}
      DB_USERNAME: ${AI_DB_USER:-ai}
      DB_PASSWORD: ${AI_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      JAVA_TOOL_OPTIONS: "-Xmx384m"

volumes:
  auth_data:
  report_data:
  portfolio_data:
  ai_data:
