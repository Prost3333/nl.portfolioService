databaseChangeLog:
  - changeSet:
      id: 001-create-trade-records-table
      author: Prost3333
      changes:
        - createTable:
            tableName: trade_records
            columns:
              - column:
                  name: trade_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: ticker
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: NUMERIC(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: NUMERIC(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: trade_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: rationale
                  type: VARCHAR(2000)
              - column:
                  name: conviction
                  type: INT
              - column:
                  name: emotion
                  type: VARCHAR(20)
              - column:
                  name: received_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_trade_records_user_date
            tableName: trade_records
            columns:
              - column:
                  name: user_id
              - column:
                  name: trade_date
